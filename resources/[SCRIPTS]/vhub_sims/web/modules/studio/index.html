<section class="mod-studio" aria-label="Estúdio de aparência">

  <!-- ======================================================
       STAGE — zona central: captura de órbita (arraste/scroll)
       ====================================================== -->
  <div class="mod-studio__stage" data-orbit-zone aria-hidden="true">
    <span class="mod-studio__stage-hint">Arraste para girar · scroll para aproximar</span>
  </div>

  <!-- ======================================================
       TOP BAR — marca + modo + status + sair
       ====================================================== -->
  <header class="mod-studio__topbar">
    <div class="mod-studio__brand">
      <img src="../../assets/logo.svg" alt="vHub Mirage">
      <div class="mod-studio__brand-text">
        <small>vHub Mirage</small>
        <strong data-studio-title>SIMS</strong>
      </div>
    </div>
    <span class="mod-studio__mode-label" data-studio-mode></span>
    <div class="mod-studio__topbar-end">
      <p class="sims-status mod-studio__topstatus" data-studio-status role="status" aria-live="polite"></p>
      <button class="sims-button sims-button--ghost-danger sims-button--sm" data-action="cancel">✕ Sair</button>
    </div>
  </header>

  <!-- ======================================================
       LEFT NAV — abas verticais com ícone + rótulo
       ====================================================== -->
  <nav class="mod-studio__nav" data-studio-tabs
    role="tablist" aria-label="Categorias de personalização"></nav>

  <!-- ======================================================
       RIGHT PANEL — controles da aba selecionada
       ====================================================== -->
  <aside class="mod-studio__panel">
    <div id="studio-controls" class="mod-studio__controls"
      data-studio-controls role="tabpanel"></div>
    <footer class="mod-studio__panel-footer">
      <button class="sims-button sims-button--sm" data-action="reset">Resetar</button>
      <button class="sims-button sims-button--primary sims-button--sm"
        data-action="continue">Confirmar →</button>
    </footer>
  </aside>

  <!-- ======================================================
       BOTTOM BAR — vistas de câmera + rotação
       ====================================================== -->
  <footer class="mod-studio__bottombar">
    <div class="mod-studio__cameras" role="group" aria-label="Vista da câmera">
      <button class="sims-cam-btn" data-action="camera-body"  aria-pressed="true">Corpo</button>
      <button class="sims-cam-btn" data-action="camera-head"  aria-pressed="false">Rosto</button>
      <button class="sims-cam-btn" data-action="camera-chest" aria-pressed="false">Torso</button>
      <button class="sims-cam-btn" data-action="camera-legs"  aria-pressed="false">Pernas</button>
      <button class="sims-cam-btn" data-action="camera-feet"  aria-pressed="false">Pés</button>
    </div>
    <div class="mod-studio__rotation" aria-label="Rotação">
      <button class="sims-rot-btn" data-action="rotate-left"  aria-label="Girar à esquerda">↶</button>
      <button class="sims-rot-btn" data-action="rotate-right" aria-label="Girar à direita">↷</button>
    </div>
  </footer>

  <!-- ======================================================
       MODAL — confirmação de saída com alterações não salvas
       ====================================================== -->
  <div class="mod-studio__modal" data-studio-modal hidden>
    <div class="mod-studio__dialog" role="dialog" aria-modal="true"
      aria-labelledby="sims-modal-title" aria-describedby="sims-modal-text">
      <h3 id="sims-modal-title">Alterações não salvas</h3>
      <p id="sims-modal-text">Você fez alterações que ainda não foram salvas. O que deseja fazer?</p>
      <div class="mod-studio__dialog-actions">
        <button class="sims-button sims-button--primary sims-button--sm"
          data-action="exit-save">Salvar</button>
        <button class="sims-button sims-button--ghost-danger sims-button--sm"
          data-action="exit-discard">Sair sem salvar</button>
        <button class="sims-button sims-button--sm"
          data-action="exit-stay">Continuar editando</button>
      </div>
    </div>
  </div>

</section>
