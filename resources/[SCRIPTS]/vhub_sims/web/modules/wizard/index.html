<section class="mod-wizard" role="dialog" aria-modal="true" aria-labelledby="wizard-title">
  <form class="mod-wizard__card" data-wizard-form>

    <!-- marca + título -->
    <div class="mod-wizard__header">
      <img src="../../assets/logo.svg" alt="vHub Mirage">
      <div>
        <small>Bem-vindo à cidade</small>
        <h2 id="wizard-title">Quem é você?</h2>
      </div>
    </div>

    <!-- linha 1: nome · sobrenome · idade -->
    <div class="mod-wizard__fields">
      <label class="sims-field">
        <span>Nome</span>
        <input name="firstname" maxlength="50" autocomplete="off" required placeholder="Ex: João">
      </label>
      <label class="sims-field">
        <span>Sobrenome</span>
        <input name="lastname" maxlength="50" autocomplete="off" required placeholder="Ex: Silva">
      </label>
      <label class="sims-field mod-wizard__age">
        <span>Idade</span>
        <input name="age" type="number" min="16" max="120" step="1" required placeholder="18">
      </label>
    </div>

    <!-- linha 2: história + papel (full-width abaixo) -->
    <div class="mod-wizard__extra">
      <label class="sims-field mod-wizard__backstory-field">
        <span>História do personagem <em class="mod-wizard__optional">(opcional)</em></span>
        <textarea name="backstory" maxlength="1000" rows="3"
          placeholder="Conte de onde vem, o que busca… (max 1000 caracteres)"></textarea>
      </label>

      <fieldset class="mod-wizard__role-group">
        <legend>Intenção de vida</legend>
        <div class="mod-wizard__role-options">
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="legal" required>
            <span>⚖️ Legal</span>
          </label>
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="ilegal">
            <span>🌑 Ilegal</span>
          </label>
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="mecanica">
            <span>🔧 Mecânica</span>
          </label>
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="hospital">
            <span>🏥 Hospital</span>
          </label>
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="policia">
            <span>🚔 Polícia</span>
          </label>
          <label class="mod-wizard__role-btn">
            <input type="radio" name="role" value="livre" checked>
            <span>🌊 Livre</span>
          </label>
        </div>
      </fieldset>
    </div>

    <!-- status + submit -->
    <div class="mod-wizard__footer">
      <p class="sims-status" data-wizard-status role="status" aria-live="polite"></p>
      <button class="sims-button sims-button--primary" type="submit">
        Entrar no estúdio →
      </button>
    </div>

  </form>
</section>
