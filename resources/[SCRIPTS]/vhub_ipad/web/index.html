    #ipad-container (zoom via largura vw)
      ├─ svg #ipad-frame ........ bezel (do protótipo; sem o wallpaper SVG)
      └─ #ipad-screen .......... overlay HTML sobre o retângulo da tela
           ├─ #ipad-wallpaper .. camada de fundo (dono = shell)
           ├─ #ipad-statusbar .. relógio + bateria
           ├─ #vhub-app ........ módulos montam aqui (lazy)
           └─ #ipad-navbar ..... ◀ ⌂ ×

        <linearGradient id="bezel-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#141416"/>
          <stop offset="50%"  stop-color="#0d0d0f"/>
          <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
        <linearGradient id="frame-edge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#3a3a3d"/>
          <stop offset="50%"  stop-color="#1c1c1e"/>
          <stop offset="100%" stop-color="#0e0e10"/>
        </linearGradient>
        <linearGradient id="gold-hairline" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#d4af6a" stop-opacity="0.9"/>
          <stop offset="35%"  stop-color="#f5d98a" stop-opacity="0.55"/>
          <stop offset="65%"  stop-color="#9e7b3a" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#d4af6a" stop-opacity="0.8"/>
        </linearGradient>
        <radialGradient id="sand-gold" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#fbe6a8"/>
          <stop offset="60%" stop-color="#d4af6a"/>
          <stop offset="100%" stop-color="#8a6a30" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- moldura fina premium: apenas ~1.4% de margem por lado -->
      <rect x="6"  y="6"  width="1168" height="808" rx="44" ry="44" fill="url(#frame-edge)"/>

    <div id="ipad-screen">
      <div id="ipad-wallpaper"></div>

      <div id="ipad-statusbar">
        <span id="ipad-clock">00:00</span>
        <div class="status-icons">
          <span>5G</span>
          <span id="ipad-batt">100%</span>
          <span>&#128267;</span>

      </div>

      <div id="vhub-app"></div>

      <nav id="ipad-navbar">
        <button data-nav="back"  title="Voltar">&#8249;</button>
