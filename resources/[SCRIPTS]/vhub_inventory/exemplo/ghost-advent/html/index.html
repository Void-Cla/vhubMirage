<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advent Calendar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <div class="advent-container" id="adventContainer" style="display: none;">
        <div class="advent-wrapper">
            <div class="advent-header">
                <h1 class="advent-title" id="adventTitle">Advent Calendar 2024</h1>
                <button class="close-btn" id="closeBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="advent-grid" id="adventGrid"></div>
            <div class="advent-reward-popup" id="rewardPopup" style="display: none;">
                <div class="reward-content">
                    <div class="reward-icon">
                        <i class="fas fa-gift"></i>
                    </div>
                    <div class="reward-text" id="rewardText"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
