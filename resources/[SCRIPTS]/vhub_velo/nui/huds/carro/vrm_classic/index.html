<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRM Clássico | vHub Velo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============================================================
     HUD DE LINHA DE PRODUÇÃO — zero markup à mão.
     A face inteira (dials, ticks, números, redzone, ponteiros, slots CDN, leituras) é
     montada por VeloDials.build(veloSpec) a partir do spec.js. Para criar um HUD novo:
       1. copie esta pasta  2. edite spec.js (os números)  3. tempere o style.css (tokens --vf-*).
     ============================================================ -->
<script src="/nui/velo-core.js"></script>
<script src="/nui/velo-dials.js"></script>
<script src="spec.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var gauges = VeloDials.build(window.veloSpec);   // desenha a face + deriva as curvas do spec
    VeloCore.init(gauges);                            // liga a telemetria com as MESMAS curvas
});
</script>
</body>
</html>
