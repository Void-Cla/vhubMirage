<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vHub WOW</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wow-players" aria-hidden="true"></div>
  <main id="wow-settings-root"></main>

  <template id="wow-settings-template">
    <section class="wow-settings" role="dialog" aria-modal="true"
      aria-labelledby="wow-settings-title" aria-describedby="wow-settings-help">
      <header class="wow-settings__header">
        <img src="../assets/logo.png" width="34" height="34" alt="vHub Mirage">
        <div>
          <h1 id="wow-settings-title">Preferências de áudio</h1>
          <p>WOW</p>
        </div>
        <button class="wow-settings__close" type="button" aria-label="Fechar">×</button>
      </header>

      <label class="wow-toggle" for="wow-streamer-mode">
        <span>
          <strong>Modo streamer</strong>
          <small id="wow-settings-help">Silencia todo áudio do WOW. A voz continua ativa.</small>
        </span>
        <input id="wow-streamer-mode" type="checkbox" role="switch">
        <i aria-hidden="true"></i>
      </label>

      <p class="wow-settings__status" role="status" aria-live="polite"></p>
    </section>
  </template>

  <script src="runtime.js"></script>
  <script src="native.js"></script>
  <script src="audio.js"></script>
  <script src="settings.js"></script>
</body>
</html>
