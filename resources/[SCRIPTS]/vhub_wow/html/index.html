<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>vHub Wow</title>
  <style>
    /* CEF headless: motor de AUDIO apenas. body/html invisiveis (A-09). A telinha
       de VIDEO ("DVD no carro") vive no vhub_vehcontrol (decisao #53 — fronteira por
       modalidade: audio=wow, video=vehcontrol). */
    html, body { background: transparent; margin: 0; padding: 0; }

    /* container OCULTO dos players de audio (audio direto + iframes YT/SC em mute headless) */
    #wow-players {
      position: absolute;
      width: 0; height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- backends de embed (excecao A-10: scripts oficiais remotos; nao vao em files{}) -->
  <!-- IFrame API SO e servida por www.youtube.com; o player em si aponta p/ nocookie
       via host no construtor (audio.js) — sem anuncio. NAO trocar por nocookie aqui
       (o endpoint iframe_api nao existe la → YT nunca carrega → som nao toca). -->
  <div id="wow-players"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script src="audio.js"></script>
</body>
</html>
