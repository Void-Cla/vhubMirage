<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>vHub Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Toast (notificações rápidas, visíveis com painel fechado) -->
  <div id="toast" class="hidden"></div>

  <!-- Announce (mensagem global full-width) -->
  <div id="announce" class="hidden"><div></div></div>

  <!-- Spec HUD -->
  <div id="spec-hud" class="hidden">Espectando <span id="spec-id"></span></div>

  <!-- ============================================================
       ASIDE: barra lateral estreita, sempre visível quando admin logado
  ============================================================ -->
  <aside id="aside" class="hidden">
    <nav id="aside-nav"><!-- botões gerados por app.js --></nav>

    <div id="aside-foot">
      <button class="aflag" id="f-god"    title="Invencível"></button>
      <button class="aflag" id="f-invis"  title="Invisível"></button>
      <button class="aflag" id="f-noclip" title="Noclip"></button>
    </div>
  </aside>

  <!-- ============================================================
       POPOVER: painel de conteúdo ao lado do aside (abre ao clicar seção)
  ============================================================ -->
  <div id="popover" class="hidden">
    <header id="pop-header">
      <span id="pop-title"></span>
      <nav id="subtabs"><!-- subcategorias --></nav>
      <div id="pop-actions">
        <input id="tb-search" placeholder="Buscar…" class="hidden" />
        <button id="btn-refresh" title="Atualizar"></button>
        <button id="btn-close"   title="Fechar"></button>
      </div>
    </header>

    <div id="pop-body">
      <!-- Painel · Visão geral -->
      <section class="view" id="view-dash-geral">
        <div class="cards" id="dash-cards"></div>
        <h3>Ações rápidas</h3>
        <div class="quick" id="quick-actions"></div>
        <h3>Equipe online</h3>
        <div id="staff-list" class="list-flat"></div>
      </section>

      <!-- Painel · Economia -->
      <section class="view hidden" id="view-dash-economia">
        <div class="cards" id="eco-cards"></div>
        <h3>Maiores saldos (online)</h3>
        <div id="eco-top" class="list-flat"></div>
        <p class="hint">Totais cobrem apenas jogadores online — verdade é o vhub_money.</p>
      </section>

      <!-- Jogadores -->
      <section class="view hidden" id="view-players">
        <div class="split">
          <div id="players-list" class="list-cards"></div>
          <div id="player-detail" class="detail empty">
            <div class="empty-msg" id="player-empty">Selecione um jogador</div>
          </div>
        </div>
      </section>

      <!-- Ações -->
      <section class="view hidden" id="view-actions">
        <div class="action-grid" id="action-grid"></div>
      </section>

      <!-- Frota -->
      <section class="view hidden" id="view-fleet">
        <div class="fleet-toolbar" id="fleet-toolbar"></div>
        <div id="fleet-list" class="list-flat"></div>
        <div id="fleet-detail" class="detail empty" style="margin-top:8px">
          <div class="empty-msg">Selecione um veículo</div>
        </div>
      </section>

      <!-- Denúncias -->
      <section class="view hidden" id="view-reports">
        <div id="reports-list" class="list-flat"></div>
      </section>

      <!-- Histórico -->
      <section class="view hidden" id="view-logs">
        <div id="logs-list" class="list-flat"></div>
      </section>
    </div>
  </div>

  <!-- ============================================================
       MODAL: confirmações e formulários (sobre tudo)
  ============================================================ -->
  <div id="modal-bg" class="hidden">
    <div id="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-actions">
        <button class="btn ghost" id="modal-cancel">Cancelar</button>
        <button class="btn primary" id="modal-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Overlay 3D: cards flutuantes sobre jogadores próximos (client/overlay.lua → NUI) -->
  <div id="overlay-container"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/players.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/fleet.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
