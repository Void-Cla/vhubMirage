## vHub Mirage — Configuração principal
## Ordem de exec é obrigatória: network → database → identity → acl → resources

exec config/network.cfg
exec config/database.cfg
exec config/identity.cfg
exec config/acl.cfg

## Credenciais Mercado Pago: somente em config/local.cfg (server-only).
exec config/local.cfg

## ── Allowlist de exports sensíveis do CORE (default-deny — N0-2 / CORE v2 FASE 1) ──
## O CORE nega TODA chamada a export privilegiado (grantPerm, banPlayer, transferKey,
## commitVehicleState, etc.) de resource que NÃO esteja nesta lista. Sem este convar a
## lista nasce vazia e o CORE nega tudo (visto no log: "trusted_resources VAZIO").
## `setr` = convar replicado; o CORE o lê em criar_config() (bootstrap.lua).
## Adicionar/remover resource = editar esta linha (CSV, sem espaços obrigatórios).
## IMPORTANTE: os setr ficam ANTES do exec resources.cfg — resource que lê o convar
## no boot (ex.: registro do coinshop no vhub_df) via a lista VAZIA (bug 2026-07-13).
setr vhub_trusted_resources "vhub_conce,vhub_garage,vhub_custom,vhub_vehcontrol,vhub_nitro,vhub_racha,vhub_admin,vhub_ferinha,vhub_legacyfuel,vhub_coinshop,vhub_df,vhub_hss"

## HSS — Sistema de Estado Humano (fisiologia por char_id).
## 0 = inativo (default seguro); 1 = engine ativa. Alterável em runtime: hss_activate / hss_deactivate.
setr vh_hss_active 1
setr vhub_core_fuel 1
setr vhub_veh_state_apply 1

## Voz — transporte Mumble nativo; distância é controlada pelo vhub_voicePMA.
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_use2dAudio false
setr voice_use3dAudio false

exec config/resources.cfg

