## vHub Mirage — Configuração principal
## Ordem de exec é obrigatória: network → database → identity → acl → resources

exec config/network.cfg
exec config/database.cfg
exec config/identity.cfg
exec config/acl.cfg
exec config/resources.cfg

## ── Allowlist de exports sensíveis do CORE (default-deny — N0-2 / CORE v2 FASE 1) ──
## O CORE nega TODA chamada a export privilegiado (grantPerm, banPlayer, transferKey,
## commitVehicleState, etc.) de resource que NÃO esteja nesta lista. Sem este convar a
## lista nasce vazia e o CORE nega tudo (visto no log: "trusted_resources VAZIO").
## `setr` = convar replicado; o CORE o lê em criar_config() (bootstrap.lua).
## Adicionar/remover resource = editar esta linha (CSV, sem espaços obrigatórios).
setr vhub_trusted_resources "vhub_conce,vhub_garage,vhub_custom,vhub_vehcontrol,vhub_nitro,vhub_racha,vhub_admin,vhub_ferinha,vhub_legacyfuel"

