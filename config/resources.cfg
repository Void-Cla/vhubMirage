## ════════════════════════════════════════════════════════════════════════════
## vHub Mirage — Ordem de carregamento de resources
## ════════════════════════════════════════════════════════════════════════════
## A ORDEM real de boot é resolvida pelo FiveM via `dependency` nos fxmanifests —
## a ordem desta lista NÃO é autoritativa. Ela é organizada por CAMADA só para
## legibilidade e para evitar erro humano. Um resource ausente aqui não sobe.
## Convenção de camadas (topo → base): infra → kernel → identidade → economia →
## personagem → veículos → gameplay → policial → periféricos → mundo/mapas.
## ════════════════════════════════════════════════════════════════════════════


## ── 0. INFRAESTRUTURA ────────────────────────────────────────────────────────
ensure oxmysql              # driver MySQL upstream (não alterar)


## ── 1. KERNEL (verdade autoritativa) ─────────────────────────────────────────
ensure vhub                 # CORE v2.0-alpha: VRAM, auth, veículo, State Bags, exports
ensure vhub_notify          # toast global padrão vHub (canal vHub:notify)
ensure vhub_target          # interação por mira (targeting) — API ox_target-compatible p/ domínios


## ── 2. IDENTIDADE E PERMISSÃO ────────────────────────────────────────────────
ensure vhub_groups          # permissões e grupos por personagem (NUI admin)
ensure vhub_identity        # nome, registro, telefone (chave Pix p/ transferências)


## ── 3. ECONOMIA ──────────────────────────────────────────────────────────────
ensure vhub_money           # Fleeca Camell — carteira, banco, ATMs, transferências P2P


## ── 4. PERSONAGEM ────────────────────────────────────────────────────────────
ensure depzitamadasptlnd    # palco de login/criação; sobe antes dos consumidores
ensure vhub_hss             # owner único de ped, spawn, posição, buckets e fisiologia por char_id
ensure vhub_rp              # comandos RP sociais: /me (broadcast por raio) + /status
ensure vhub_spawselector    # seleção de local de spawn (gated pelo HSS)
ensure vhub_sims            # criação e edição de aparência; persiste exclusivamente via owners
ensure vhub_inventory       # itens, peso, baús, CHAVES de veículo
ensure vhub_voicePMA        # voz Mumble nativa: proximidade, rádio, ligação e ducking do WOW
ensure vhub_npcai           # NPCs por voz: Whisper local, intenção/LLM e TTS


## ── 5. VEÍCULOS (dependem de inventory + money) ──────────────────────────────
## Doutrina da Placa: toda verdade veicular persistida mora na placa via conce.
ensure vhub_conce           # identidade: chave↔placa↔dono + concessionária + cron 24h + prontuário
ensure carmod               # pacote único de carros mod (streaming dinâmico via glob)
ensure vhub_ferinha         # marketplace: leilões (backend antes da NUI do garage)
ensure vhub_garage          # guardar/spawnar por CHAVE + NUI do hub + impound
ensure vhub_wow             # áudio 2D/3D, ducking por voz e modo streamer local
ensure vhub_vehcontrol      # tiers, skill de handling, velocímetro (absorveu vrm_velocimetro 2026-06-03)
ensure vhub_custom          # oficina: bennys (estética) + mec (reparo) + tuning
ensure vhub_velo            # HUD velocímetro/combustível (PURO CONSUMIDOR de bags vh_fuel/vh_odo)
ensure vhub_legacyfuel      # abastecimento; estado fuel pertence ao CORE (ADR #61)


## ── 6. GAMEPLAY DE CORRIDA ───────────────────────────────────────────────────
ensure vhub_racha           # corridas ilegais: lobby, ranking, histórico
# Drift — shim removido FASE 5 ADR #81 (absorvido em vhub_custom:driftTelemetry)
ensure vhub_vrcs            # Race Cinema System: telemetria ranqueada .vhr + fila de render


## ── 7. POLICIAL / LSPD ───────────────────────────────────────────────────────
ensure vhub_lspdtool        # radar/helicam lê placa → checa BOLO → alerta dispatch


## ── 8. ADMINISTRAÇÃO ─────────────────────────────────────────────────────────
ensure vhub_admin           # painel admin v2 (9 abas NUI)
ensure vhub_df              # gateway Pix MercadoPago (QR + polling + webhook) — antes do coinshop
ensure vhub_coinshop

## ── 9. PERIFÉRICOS (UI / entrada / social) ───────────────────────────────────
ensure vhub_login           # gate de login fail-closed; selector obrigatório no handoff
ensure vhub_loading         # tela de loading personalizada (logo + dicas)
ensure vhub_ipad            # tablet: apps/serviços in-game
ensure vhub_animacao         # emotes/animações + sentar em props — gated pelo vhub_hss (algemas/inconsciência/arma)

## ── 10. MUNDO E MAPAS (cada mapa = resource próprio em resources/[mapas]) ─────
