endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_lan 0

sv_maxclients 7
sv_filterRequestControl 2
sv_pureLevel 1
sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false

onesync on
set onesync_enabled true
set onesync_enableInfinity 1
onesync_distanceCullVehicles true
onesync_forceMigration true

set rateLimiter_stateBag_rate 2000
set rateLimiter_stateBag_burst 3000

set sv_enforceGameBuild 2189
